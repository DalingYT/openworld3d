<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenWorld3D</title>
    <style>
      #apodo {
        width: min(360px, calc(100vw - 72px));
        padding: 24px;
        border: 1px solid #496077;
        border-radius: 12px;
        background: #162739;
        color: #fff;
        font: 16px/1.5 system-ui, sans-serif;
        color-scheme: dark;
      }
      #apodo::backdrop { background: #0b1827a8; }
      #apodo form { display: grid; gap: 12px; }
      #apodo input, #apodo button {
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: 6px;
        font: inherit;
      }
      #apodo input { min-width: 0; border: 1px solid #8098b0; }
      #apodo button { border: 0; background: #a8dbff; color: #0b1827; cursor: pointer; }
      #apodo button:disabled { opacity: 0.65; cursor: wait; }
      #apodo p { margin: 0; font-size: 14px; }
      #apodo p:empty { display: none; }
      #game-status {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        color: #fff;
        font: 13px system-ui, sans-serif;
        pointer-events: none;
      }
      #game-status p {
        margin: 0;
        padding: 8px 12px;
        border-radius: 6px;
        background: #162739;
      }
      #coordinates { width: max-content; font-variant-numeric: tabular-nums; }
      #lan-status:not([hidden]) { margin-top: 4px; }
      @media (max-width: 480px) {
        body #game-chat { top: max(50px, calc(env(safe-area-inset-top) + 38px)); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="touch-controls" aria-label="Controles táctiles">
      <div id="joystick" aria-label="Mover"><span></span></div>
      <div id="touch-actions">
        <button id="touch-camera" type="button" aria-pressed="false">3.ª persona</button>
        <button id="touch-run" type="button" aria-pressed="false">Correr</button>
        <button id="touch-jump" type="button">Saltar</button>
      </div>
    </div>
    <dialog id="apodo" aria-labelledby="texto-apodo">
      <form>
        <label id="texto-apodo" for="nombre">Introduce tu apodo, se mostrará a los demás jugadores</label>
        <input id="nombre" name="nombre" maxlength="24" required autofocus autocomplete="off" />
        <button type="submit">Entrar</button>
        <p role="status"></p>
      </form>
    </dialog>
    <div id="game-status">
      <p id="coordinates" aria-label="Coordenadas del jugador" hidden></p>
      <p id="lan-status" role="status" hidden></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
